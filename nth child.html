<html>
    <head>
        <style>
            li:nth-child(even) {
                background-color: #076dcc;
            }
            li:nth-child(1) {
                background-color: #a25d08;
                font-weight: bold;
            }
            li:nth-child(-n+3) {
                border: 20px solid green;
            }
            li:nth-child(n+4) {
                color: rgb(219, 7, 138);
            }
        </style>
    </head>
    <body>
        <h3>css : nth-child() Demo</h3>
        <ul>
            <li>List item 1</li>
            <li>List item 2</li>
            <li>List item 3</li>
            <li>List item 4</li>
            <li>List item 5</li>
            <li>List item 6</li>
            <li>List item 7</li>
            <li>List item 8</li>
        </ul>
    </body>
</html>
